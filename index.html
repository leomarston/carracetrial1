<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Car Race — Highway Battle</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🏎️</text></svg>"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app"></div>

    <!-- Loading overlay -->
    <div id="loading-overlay">
      <div class="loading-box">
        <h1>HIGHWAY BATTLE</h1>
        <div class="progress-track">
          <div id="progress-bar"></div>
        </div>
        <p id="loading-status">Loading map…</p>
      </div>
    </div>

    <!-- Per-player HUD (racing-game style: top half = P1, bottom half = P2) -->
    <div id="p1-hud" class="rhud hidden">
      <div class="rhud-info">
        <div class="rhud-info-top">
          <span class="rhud-pos">1</span>
          <span class="rhud-time">0:00.00</span>
        </div>
        <div class="rhud-info-bot">
          <span class="rhud-lap-lbl">LAP</span>
          <span class="rhud-lap">1/2</span>
        </div>
      </div>
      <div class="rhud-speed">
        <svg class="rhud-nos" viewBox="0 0 100 100" aria-hidden="true">
          <circle class="nos-track" cx="50" cy="50" r="42"></circle>
          <circle class="nos-fill" cx="50" cy="50" r="42"></circle>
          <path class="nos-bottle" d="M44 34 h12 v5 l3 6 v15 a3 3 0 0 1 -3 3 h-12 a3 3 0 0 1 -3 -3 v-15 l3 -6 z"></path>
        </svg>
        <div class="rhud-read">
          <span class="rhud-unit">KM/H</span>
          <span class="rhud-kmh">0</span>
        </div>
        <span class="rhud-gear">1</span>
      </div>
    </div>

    <div id="p2-hud" class="rhud hidden">
      <div class="rhud-info">
        <div class="rhud-info-top">
          <span class="rhud-pos">2</span>
          <span class="rhud-time">0:00.00</span>
        </div>
        <div class="rhud-info-bot">
          <span class="rhud-lap-lbl">LAP</span>
          <span class="rhud-lap">1/2</span>
        </div>
      </div>
      <div class="rhud-speed">
        <svg class="rhud-nos" viewBox="0 0 100 100" aria-hidden="true">
          <circle class="nos-track" cx="50" cy="50" r="42"></circle>
          <circle class="nos-fill" cx="50" cy="50" r="42"></circle>
          <path class="nos-bottle" d="M44 34 h12 v5 l3 6 v15 a3 3 0 0 1 -3 3 h-12 a3 3 0 0 1 -3 -3 v-15 l3 -6 z"></path>
        </svg>
        <div class="rhud-read">
          <span class="rhud-unit">KM/H</span>
          <span class="rhud-kmh">0</span>
        </div>
        <span class="rhud-gear">1</span>
      </div>
    </div>

    <!-- Wrong-way warnings (one per player half) -->
    <div id="p1-wrongway" class="wrongway hidden"><span>WRONG WAY</span></div>
    <div id="p2-wrongway" class="wrongway hidden"><span>WRONG WAY</span></div>

    <!-- Split-screen divider -->
    <div id="divider" class="hidden"></div>

    <!-- Minimap (shared, shows both cars) -->
    <div id="minimap-wrap" class="hidden">
      <canvas id="minimap"></canvas>
    </div>

    <!-- Standing-start countdown -->
    <div id="countdown" class="hidden"></div>

    <!-- Finish banner -->
    <div id="finish-banner" class="hidden">
      <div class="fb-title">FINISH! 🏁</div>
      <div class="fb-row result"></div>
      <div class="fb-row">Time: <span class="total">--</span></div>
      <div class="fb-hint">Press <b>R</b> to race again</div>
    </div>

    <!-- Attribution required by the assets' CC-BY-4.0 licenses -->
    <div id="attribution">
      Map: <a href="https://sketchfab.com/3d-models/nfs-undercover-ds-highway-battle-e8b1859b628a42209b8866d9a4b45936" target="_blank" rel="noopener">"NFS Undercover DS – Highway Battle"</a>
      by <a href="https://sketchfab.com/amogusstrikesback2" target="_blank" rel="noopener">amogusstrikesback2</a>
      · Cars: "Mercedes-Benz Silver Lightning" &amp; "Koenigsegg CC850"
      (<a href="http://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC-BY-4.0</a>)
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
