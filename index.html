<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Car Race — Highway Battle</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🏎️</text></svg>"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app"></div>

    <!-- Loading overlay -->
    <div id="loading-overlay">
      <div class="loading-box">
        <h1>HIGHWAY BATTLE</h1>
        <div class="progress-track">
          <div id="progress-bar"></div>
        </div>
        <p id="loading-status">Loading map…</p>
      </div>
    </div>

    <!-- Controls hint -->
    <div id="controls-hint" class="hidden">
      <b>P1</b> W A S D + Space &nbsp;·&nbsp; <b>P2</b> ◄ ▲ ▼ ► + Right-Shift &nbsp;·&nbsp; <b>R</b> restart
    </div>

    <!-- Per-player HUDs (top half = P1, bottom half = P2) -->
    <div id="p1-hud" class="player-hud hidden">
      <div class="ph-row"><span class="ph-tag">P1</span><span class="ph-lap">LAP 1/2</span><span class="ph-pos">1st</span></div>
      <div class="ph-speed"><span class="ph-kmh">0</span><span class="ph-unit">km/h</span><span class="ph-gear">1</span></div>
    </div>
    <div id="p2-hud" class="player-hud hidden">
      <div class="ph-row"><span class="ph-tag p2">P2</span><span class="ph-lap">LAP 1/2</span><span class="ph-pos">2nd</span></div>
      <div class="ph-speed"><span class="ph-kmh">0</span><span class="ph-unit">km/h</span><span class="ph-gear">1</span></div>
    </div>

    <!-- Split-screen divider -->
    <div id="divider" class="hidden"></div>

    <!-- Minimap (shared, shows both cars) -->
    <div id="minimap-wrap" class="hidden">
      <canvas id="minimap"></canvas>
    </div>

    <!-- Standing-start countdown -->
    <div id="countdown" class="hidden"></div>

    <!-- Finish banner -->
    <div id="finish-banner" class="hidden">
      <div class="fb-title">FINISH! 🏁</div>
      <div class="fb-row result"></div>
      <div class="fb-row">Time: <span class="total">--</span></div>
      <div class="fb-hint">Press <b>R</b> to race again</div>
    </div>

    <!-- Attribution required by the assets' CC-BY-4.0 licenses -->
    <div id="attribution">
      Map: <a href="https://sketchfab.com/3d-models/nfs-undercover-ds-highway-battle-e8b1859b628a42209b8866d9a4b45936" target="_blank" rel="noopener">"NFS Undercover DS – Highway Battle"</a>
      by <a href="https://sketchfab.com/amogusstrikesback2" target="_blank" rel="noopener">amogusstrikesback2</a>
      · Rival: "Koenigsegg CC850" by amogusstrikesback2
      (<a href="http://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC-BY-4.0</a>)
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
